<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">R1 小玉狐耳角色卡</title>
  <desc id="desc">提取涂山小玉高狐耳、淡紫长发、细长紫眸与红结绳的角色图鉴卡图标</desc>
  <style>
    :root{--ink:#263a63;--primary:#4f7cff;--hair:#a978ef;--hair-light:#d8b9ff;--eye:#7650d8;--ribbon:#df5969;--accent:#f2c45d;--skin:#f8e6ea;--cut:#f3f7ff}
    .stroke{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.ink{fill:var(--ink)}.primary{fill:var(--primary)}.hair{fill:var(--hair)}.hair-light{fill:var(--hair-light)}.eye{fill:var(--eye)}.ribbon{fill:var(--ribbon)}.accent{fill:var(--accent)}.skin{fill:var(--skin)}.cut{fill:var(--cut)}
  </style>
  <rect class="stroke" x="10" y="8" width="44" height="49" rx="12"/>
  <!-- 狐耳与后发形成纵向角色轮廓 -->
  <path class="hair" d="m17.8 27 2.8-18.5 10.1 13.2c.5-.1 1-.1 1.5-.1s1 0 1.5.1L43.5 8.5 46.3 27c2.2 4.1 2.4 12.3.7 24.1l-8.1 1.7-6.7-4.2-6.8 4.2-8.2-1.7c-1.8-11.8-1.6-20 .6-24.1Z"/>
  <path class="hair-light" d="m22.2 13.9-1.1 10.3c1.9-1.2 3.9-2 6-2.3l-4.9-8Zm19.9 0 1.1 10.4c-1.8-1.2-3.8-2-6-2.4l4.9-8Z"/>
  <!-- 瘦长脸型，避免圆形萌宠脸 -->
  <path class="skin" d="M23.1 29.2c0-6.2 3.5-9.7 9.1-9.7s9.1 3.5 9.1 9.7c0 8-4 14.7-9.1 14.7s-9.1-6.7-9.1-14.7Z"/>
  <!-- 二次元刘海：中间发束 + 两侧包脸 -->
  <path class="hair" d="M22.9 29.5c.2-6.7 3.5-10.4 9.3-10.4 5.7 0 9.1 3.6 9.3 10.2-2.2-2.8-4.3-4.8-6.5-6 .1 3.1-.8 5.5-2.8 7.3-.4-3-1.4-5.2-3-6.7-1 2.5-3.1 4.4-6.3 5.6Z"/>
  <path class="hair-light" d="M23.2 28.9c-1.5 5.9-1.3 11.9.4 17.9l4.1-2.8c-2.1-4.6-2.4-9.6-.9-15l-3.6-.1Zm17.8 0c1.5 5.9 1.3 11.9-.4 17.9L36.5 44c2.1-4.6 2.4-9.6.9-15l3.6-.1Z"/>
  <!-- 细长眼型 -->
  <path class="ink" d="M24.9 33.5c2.1-1.5 4.1-1.5 6.1 0-2 2.2-4 2.2-6.1 0Zm8.5 0c2.1-1.5 4.1-1.5 6.1 0-2 2.2-4 2.2-6.1 0Z"/>
  <circle class="eye" cx="28" cy="33.5" r="1.2"/><circle class="eye" cx="36.5" cy="33.5" r="1.2"/>
  <path class="thin" d="M30.2 39.2c1.3.8 2.6.8 3.9 0"/>
  <!-- 侧边红结绳只作识别色 -->
  <path class="ribbon" d="M20.4 27.8c-3.9-2.8-6.7-2.6-8.2.7 3.1 1.5 5.8 1.3 8.2-.7Zm23.5 0c3.9-2.8 6.7-2.6 8.2.7-3.1 1.5-5.8 1.3-8.2-.7Z"/>
  <circle class="accent" cx="20.7" cy="29.3" r="1.9"/><circle class="accent" cx="43.6" cy="29.3" r="1.9"/>
  <!-- 肩部胸像加强“角色”而非萌宠 -->
  <path class="primary" d="M20.4 53c.9-6.1 4.6-9.2 11.8-9.2s10.9 3.1 11.8 9.2H20.4Z"/>
  <path class="accent" d="M50 6.8c.4 3.2 2 4.8 5.2 5.2-3.2.4-4.8 2-5.2 5.2-.4-3.2-2-4.8-5.2-5.2 3.2-.4 4.8-2 5.2-5.2Z"/>
  <path class="stroke" d="M16 14h8" opacity=".65"/>
</svg>
